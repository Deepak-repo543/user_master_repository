server:
  port: 8080

spring:
  application:
    name: user-master

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/user-master-db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: deepakr@dreamsol.biz
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

excel:
  notification-email: deepakr@dreamsol.biz

file:
  upload-dir: uploads

cors:
  allowed-origins: http://localhost:5173

master-service:
  url: ${MASTER_SERVICE_URL:http://localhost:8087}